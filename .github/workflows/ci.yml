name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests（零 API Key、零外部服务）
        run: python -m pytest -q

  retrieval-gate:
    name: retrieval eval gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Evaluate（50 条评估集，离线可复现）
        run: python -m eval.run_eval
      - name: Gate（Recall@5 / MRR 不得倒退）
        run: python scripts/eval_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: var/eval_report.json
